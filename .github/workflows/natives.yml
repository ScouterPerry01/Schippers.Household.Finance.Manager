# Rebuilds the Windows HEIC helper (tools/natives/wic, ADR 0004) and prints its SHA-256, to compare
# with the copy committed in core/ocr-desktop/src/main/resources/hfm/heif/native. It contains no
# codec: Windows decodes HEIC with the extensions the user installs. Run by hand after changing it.
name: Native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build hfmwic.dll
        shell: pwsh
        run: |
          powershell -NoProfile -File tools/natives/build-wic.ps1 -Out out -Work "$env:RUNNER_TEMP\wic"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-FileHash out/hfmwic.dll
      - uses: actions/upload-artifact@v4
        with:
          name: hfmwic-windows-x86_64
          path: out/
