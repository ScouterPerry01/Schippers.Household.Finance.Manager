name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-and-desktop:
    name: Core + desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # HEIC photos are read with a decoder the user installs (ADR 0004); the Linux run tests with
      # the distribution's libheif and HEVC plugin. Windows runners have no HEVC extension, so the
      # missing-decoder path is tested there.
      - name: HEIC decoder for the tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libheif1 libheif-plugin-libde265
      - name: Test core libraries and build the desktop app
        run: ./gradlew test :app:desktop:jar --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  android:
    name: Android companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:android:assembleDebug --console=plain

  performance:
    name: Performance (NFR-02, 30 years of data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Time screens and reports on 250,000 transactions
        # CI machines are slower and shared; the limits are relaxed three times here.
        env:
          HFM_PERF_FACTOR: "3"
        run: ./gradlew :core:books:performanceTest --console=plain
