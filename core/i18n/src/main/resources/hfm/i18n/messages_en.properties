rateRule.tax.prov.employmentAmount=Territorial Canada employment amount
rateRule.tax.prov.employmentAmount.hint=The most that can be claimed for employment income on the territorial return (Yukon). Used by the income tax estimate.
rateRule.tax.prov.pension=Provincial pension income amount
rateRule.tax.prov.pension.hint=The most that can be claimed on eligible pension income. Used by the income tax estimate.
rateRule.tax.prov.medical=Provincial medical expense threshold
rateRule.tax.prov.medical.hint=Rate of net income; fixed amount. Medical expenses count above the lesser of the two. Used by the income tax estimate.
rateRule.tax.prov.donation=Provincial donation credit rates
rateRule.tax.prov.donation.hint=First tier (200 dollars); its rate; the rate above it; and, where there is one, the higher rate on the gifts matched by income in the top bracket. Used by the income tax estimate.
rateRule.tax.prov.dividends=Provincial dividend tax credit
rateRule.tax.prov.dividends.hint=Credit rates on the taxable amount of eligible dividends, then of other dividends. Used by the income tax estimate.
rateRule.tax.prov.supplementalCredit=Supplemental tax credit
rateRule.tax.prov.supplementalCredit.hint=Credit amounts above this threshold; the extra rate on them (Alberta, since its 8 % bracket). Used by the income tax estimate.
rateRule.tax.prov.surtax=Provincial surtax
rateRule.tax.prov.surtax.hint=Threshold; rate; threshold; rate. Each rate applies to the provincial tax after credits above its threshold (Ontario). Used by the income tax estimate.
rateRule.tax.prov.taxReduction=Provincial tax reduction
rateRule.tax.prov.taxReduction.hint=The basic reduction: the tax is reduced by twice this amount less the tax, when positive (Ontario). Used by the income tax estimate.
rateRule.tax.prov.lowIncomeReduction=Low-income tax reduction
rateRule.tax.prov.lowIncomeReduction.hint=Maximum; net income above which it is reduced; reduction rate (British Columbia). Used by the income tax estimate.
rateRule.tax.prov.healthPremium=Health premium
rateRule.tax.prov.healthPremium.hint=For each tier: taxable income from; rate on the income above it; the premium''s cap (Ontario Health Premium). Used by the income tax estimate.
rateRule.tax.qc.workerDeduction=Quebec deduction for workers
rateRule.tax.qc.workerDeduction.hint=Rate of employment income; maximum. Deducted from income on the Quebec return. Used by the income tax estimate.
rateRule.tax.qc.retirement=Quebec retirement income amount
rateRule.tax.qc.retirement.hint=Maximum; factor applied to eligible pension income. Reduced with the age amount on family income. Used by the income tax estimate.
rateRule.tax.qc.medical=Quebec medical expense credit
rateRule.tax.qc.medical.hint=Rate of family income above which expenses count; the credit rate. Used by the income tax estimate.
rateRule.tax.donationLimit=Donation limit
rateRule.tax.donationLimit.hint=The share of net income up to which donations, this year''s and those carried forward, can be claimed in a year; the rest is carried forward. Used by the income tax estimate.
rateRule.tax.fed.tuitionTransfer=Federal tuition transfer maximum
rateRule.tax.fed.tuitionTransfer.hint=The most of this year''s tuition amount a student can transfer to a spouse, parent or grandparent, less what they use themselves. Used by the income tax estimate.
rateRule.tax.prov.tuition=Provincial tuition credit
rateRule.tax.prov.tuition.hint=Whether this year''s tuition fees give the provincial or territorial credit (Ontario, Saskatchewan and Alberta ended it). Unused amounts carried forward count either way. Used by the income tax estimate.
rateRule.tax.prov.tuitionTransfer=Provincial tuition transfer maximum
rateRule.tax.prov.tuitionTransfer.hint=The most of this year''s provincial or territorial tuition amount a student can transfer to a spouse, parent or grandparent. Used by the income tax estimate.
rateRule.tax.qc.tuition=Quebec tuition credit
rateRule.tax.qc.tuition.hint=The rate of Quebec''s credit on tuition fees. Unused fees are carried forward or transferred to a parent or grandparent. Used by the income tax estimate.
rateRule.tax.cwb.single=Canada workers benefit, single person
rateRule.tax.cwb.single.hint=Working income threshold; phase-in rate; maximum; adjusted family net income where the reduction starts; reduction rate. Quebec, Alberta and Nunavut have their own values. Used by the income tax estimate.
rateRule.tax.cwb.couple=Canada workers benefit, couple
rateRule.tax.cwb.couple.hint=For a person with a spouse or common-law partner and no child: working income threshold; phase-in rate; maximum; family net income where the reduction starts; reduction rate. Used by the income tax estimate.
rateRule.tax.cwb.singleParent=Canada workers benefit, single parent
rateRule.tax.cwb.singleParent.hint=For a person with an eligible dependant and no spouse: working income threshold; phase-in rate; maximum; family net income where the reduction starts; reduction rate. Used by the income tax estimate.
rateRule.tax.cwb.coupleChildren=Canada workers benefit, couple with children
rateRule.tax.cwb.coupleChildren.hint=For a couple with an eligible dependant: working income threshold; phase-in rate; maximum; family net income where the reduction starts; reduction rate. Used by the income tax estimate.
rateRule.tax.cwb.secondaryEarner=Workers benefit secondary earner exemption
rateRule.tax.cwb.secondaryEarner.hint=The most of the lower earner''s working income left out of a couple''s family net income for the Canada workers benefit. Used by the income tax estimate.
rateRule.tax.fed.medicalSupplement=Refundable medical expense supplement
rateRule.tax.fed.medicalSupplement.hint=Maximum; minimum earned income; family net income where it starts to fall; rate of the medical expenses claimed; reduction rate. Used by the income tax estimate.
rateRule.tax.qc.workPremium=Quebec work premium
rateRule.tax.qc.workPremium.hint=Work income excluded for a single person; for a couple; ceiling for a single person; for a couple (also where the reduction starts); rate without children; for a single parent; for a couple with children; reduction rate on family income. Used by the income tax estimate.
rateRule.tax.qc.medicalRefund=Quebec refundable credit for medical expenses
rateRule.tax.qc.medicalRefund.hint=Maximum; minimum work income; family income where it starts to fall; rate of the medical expenses; reduction rate. Used by the income tax estimate.
rateRule.tax.gstCredit=GST/HST credit
rateRule.tax.gstCredit.hint=By base year (paid from the next July): amount per adult; per child; single supplement; net income where the supplement starts; its rate; family net income threshold; reduction rate. Since July 2026, the Canada Groceries and Essentials Benefit. Used by the income tax estimate.
rateRule.tax.ccb=Canada child benefit
rateRule.tax.ccb.hint=By base year (paid from the next July): per child under 6; per child 6 to 17; first and second family net income thresholds; reduction rates between them for 1, 2, 3, 4 or more children; then the rates above the second threshold. Used by the income tax estimate.
rateRule.tax.oasRecovery=OAS recovery tax
rateRule.tax.oasRecovery.hint=Net income threshold; rate. The Old Age Security pension is repaid at this rate of net income above the threshold, up to the pension received. Used by the income tax estimate.
rateRule.tax.amt=Federal alternative minimum tax
rateRule.tax.amt.hint=Rate; basic exemption; share of the non-refundable credits allowed (other than donations); share of the donation credit; share added back of the deductions allowed only in part; the gross-up share removed from eligible and from other taxable dividends. Used by the income tax estimate.
rateRule.tax.prov.amt=Provincial minimum tax
rateRule.tax.prov.amt.hint=The provincial or territorial additional tax, as a rate of the federal additional tax; the rate of the federal minimum tax carryover recovered on the provincial or territorial return. Used by the income tax estimate.
rateRule.tax.qc.amt=Quebec alternative minimum tax
rateRule.tax.qc.amt.hint=Rate; basic exemption; share of the credits allowed (other than donations); share of the donation credit; share added back of the deductions allowed only in part, the deduction for workers among them. Used by the income tax estimate.
rateRule.tax.qc.fss=Quebec health services fund contribution
rateRule.tax.qc.fss.hint=Exclusion threshold; second threshold; rate; the most below the second threshold; maximum. On income other than employment income, OAS and the dividend gross-up. Used by the income tax estimate.
rateRule.tax.qc.drugPremium=Quebec prescription drug insurance premium
rateRule.tax.qc.drugPremium.hint=The year''s maximum premium; family income exempt for a person alone, a single parent with one child or more, a couple, a couple with one child or more; income above the exemption where the higher rate starts; the two rates for a person alone, then for a couple. Used by the income tax estimate.

