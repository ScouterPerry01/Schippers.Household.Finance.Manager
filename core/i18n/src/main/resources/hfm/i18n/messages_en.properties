rateRule.tax.prov.age=Provincial age amount
rateRule.tax.prov.age.hint=Maximum; net income above which it is reduced; reduction rate. In Quebec, the reduction is on family income and covers the retirement income amount too. Used by the income tax estimate.
rateRule.tax.prov.seniorSupplement=Senior supplementary amount
