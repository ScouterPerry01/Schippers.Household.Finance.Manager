about.licence.title=Licence and source code
about.licence.body=RANN''s Roost is free software under the GNU General Public License, version 3 or later, and comes with no warranty. Its source code is on GitHub. The names RANN, RANN''s Roost and RANN''s Roost Mobile and the logo are © Perry Schippers, trading as RANN, and are not covered by the licence.
