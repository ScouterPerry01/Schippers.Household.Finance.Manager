update.ask.title=Check for updates?
update.ask.body=RANN''s Roost can check GitHub once a day for a new version and tell you when one is ready. Only the check itself goes out: GitHub sees your computer''s internet address and that the app is in use, as for any web page. Nothing about your household is sent. Every update is checked against RANN''s signature before it can be installed. You can change this later under About.
