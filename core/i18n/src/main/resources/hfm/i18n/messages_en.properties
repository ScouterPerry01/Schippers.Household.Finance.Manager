rateRule.reminder.assetsReport.hint=How many days ahead the assets report lists warranties ending.
rateRule.reminder.cardPayment=Card payment reminder (days ahead)
rateRule.reminder.cardPayment.hint=How many days before a credit card payment is due it shows among the reminders, when the card is owed something.
rateRule.reminder.billsAgenda=Bills agenda (days ahead)
rateRule.reminder.billsAgenda.hint=How many days ahead the Agenda tab of Bills lists upcoming bills.
