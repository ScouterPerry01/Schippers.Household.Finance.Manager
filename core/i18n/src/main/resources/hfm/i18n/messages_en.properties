about.link=About and privacy
about.privacy.title=Privacy
about.privacy.body=Your financial information stays on your computer and your phone, encrypted. RANN does not receive or collect it: there is no RANN account, no advertising and no analytics. The app goes on the internet only for the Bank of Canada exchange rates when your household uses another currency, the price downloads you turn on, the watch-only wallet updates you ask for and, on Linux, the update check if you agreed. The privacy policy says what each service learns.
