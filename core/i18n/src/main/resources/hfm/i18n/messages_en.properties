rateRule.reminder.instalment.hint=How many days before and after its due date an unpaid tax instalment shows among the reminders.
rateRule.reminder.medicalClaim=Medical claim deadline reminders (days)
rateRule.reminder.medicalClaim.hint=How many days before and after its deadline a medical claim still to send shows among the reminders.
rateRule.reminder.maturity=Bond and GIC maturity reminders (days ahead)
rateRule.reminder.maturity.hint=How many days before maturity a bond or GIC shows among the reminders and in the calendar.
rateRule.reminder.insurance=Insurance renewal reminders (days)
rateRule.reminder.insurance.hint=How many days before and after its renewal date an insurance policy shows among the reminders.
rateRule.reminder.newBill=New bill reminders (days before)
rateRule.reminder.newBill.hint=The reminders a new bill starts with, in days before it is due, such as 7; 1. Each bill can then have its own.
rateRule.reminder.newEvent=New event reminder (minutes before)
rateRule.reminder.newEvent.hint=The reminder a new calendar event starts with, in minutes before it starts: 1440 is one day. Each event can then have its own.
rateRule.reminder.refill=New medication refill reminder (days)
rateRule.reminder.refill.hint=The days before a refill is due that a new medication starts with. Each medication can then have its own.
rateRule.reminder.maintenance=New maintenance task reminder (days)
rateRule.reminder.maintenance.hint=The days before it is due that a new maintenance task starts with, for vehicles and other assets.
rateRule.reminder.loanRenewal=New loan renewal reminder (days)
rateRule.reminder.loanRenewal.hint=The days before the end of its term that a new loan or mortgage starts with. Each loan can then have its own.
rateRule.reminder.medicalPlanDeadline=New medical plan claim deadline (days)
rateRule.reminder.medicalPlanDeadline.hint=The days after the service to send a claim that a new medical plan starts with. Each plan can then have its own.
rateRule.reminder.syncInvitation=Phone pairing code (minutes)
rateRule.reminder.syncInvitation.hint=How many minutes the QR code for pairing a phone stays valid.
rateRule.reminder.documentMatch=Document and transaction match (days)
rateRule.reminder.documentMatch.hint=How many days before or after a receipt''s or bill''s date a transaction of the same amount is proposed as its match.
rateRule.reminder.billMatch=Bill document match (days)
rateRule.reminder.billMatch.hint=How many days before or after a captured bill''s due date the bill''s nearest due date is looked for when it is filed with a bill.
rateRule.reminder.documentRetention=Document retention (years)
rateRule.reminder.documentRetention.hint=How many years filed documents are kept before the Retention tab offers them for discarding. The CRA asks for six years from the end of the tax year. Nothing is deleted automatically.
rateRule.threshold.reconcileBehind=Reconciliation behind (days)
rateRule.threshold.reconcileBehind.hint=An account not reconciled for more than this many days is shown as behind on Accounts, the Dashboard and the reconciliation report.
rateRule.threshold.unusualBill=Unusual bill (percent of average)
rateRule.threshold.unusualBill.hint=A bill above this percentage of the average of its previous bills (at least three) is flagged as unusual: 125 means a quarter above.
rateRule.threshold.budgetAlert=Budget alert (percent)
rateRule.threshold.budgetAlert.hint=A budget is flagged once spending is above this percentage of it: 100 flags only overspending, 90 flags it from 90 %.
rateRule.threshold.t5Interest=T5 slip for interest (dollars)
rateRule.threshold.t5Interest.hint=Interest from one payer in a year at or above this amount is expected on a T5 slip in the tax year checklist. The CRA does not require a T5 for less than $50.
rateRule.threshold.statementFx=Foreign currency statement tolerance
rateRule.threshold.statementFx.hint=How far a statement line may differ from a purchase recorded in a foreign currency and still be proposed as its match: 0.035 is 3.5 %.
rateRule.threshold.receiptTaxAmount=Receipt tax tolerance (dollars)
rateRule.threshold.receiptTaxAmount.hint=How far a receipt''s printed tax may differ from what its marked lines would give, in dollars, for the tax codes to be trusted when the receipt is split by item. The larger of this and the tolerance rate applies.
rateRule.threshold.receiptTaxRate=Receipt tax tolerance (rate)
rateRule.threshold.receiptTaxRate.hint=The same tolerance as a share of the printed tax: 0.03 is 3 %.
rateRule.threshold.depreciationYears=Depreciation years
rateRule.threshold.depreciationYears.hint=The years over which an asset with no years of its own loses its value, straight line.
rateRule.threshold.depreciationResidual=Residual value
rateRule.threshold.depreciationResidual.hint=The share of its price an asset with no residual value of its own keeps at the end: 0 is nothing left, 0.1 is 10 %.
rateRule.threshold.backupEvery=Automatic backups (every so many days)
rateRule.threshold.backupEvery.hint=How often automatic backups run until an administrator chooses on the Backups screen: 1 is daily, 7 is weekly, 0 is off.
rateRule.threshold.backupKeep=Backups to keep
rateRule.threshold.backupKeep.hint=How many backups are kept until an administrator chooses on the Backups screen.
