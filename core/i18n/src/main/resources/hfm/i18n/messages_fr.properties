taxEstimate.noSpouse=Entrez-le quand la personne a un époux ou un conjoint de fait : il donne le montant pour époux, et les montants familiaux (allocation pour les travailleurs, crédit pour la TPS/TVH, primes du Québec) deviennent ceux d’un couple. Sinon, laissez-le vide.
