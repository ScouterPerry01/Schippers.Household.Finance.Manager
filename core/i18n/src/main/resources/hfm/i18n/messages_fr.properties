taxEstimateHint.SPOUSE_WORKING_INCOME=Ses revenus d’emploi et de travail autonome, pour l’Allocation canadienne pour les travailleurs et la prime au travail du Québec d’un couple.
taxEstimateHint.CHILDREN=Ils font d’une personne seule un parent seul pour l’allocation pour les travailleurs et le crédit pour la TPS/TVH, et donnent l’Allocation canadienne pour enfants.
taxEstimateHint.OAS=La pension reçue, avant toute retenue. Au-delà d’un seuil de revenu net, 15 % de l’excédent est remboursé, jusqu’à concurrence de la pension.
taxEstimateHint.AMT_CARRIED=Impôt supplémentaire payé pour l’impôt minimum dans les sept années précédentes et pas encore récupéré. Il ramène l’impôt régulier jusqu’à l’impôt minimum.
taxEstimateHint.DRUG_PLAN_MONTHS=Les mois où la personne était couverte par le régime public de la RAMQ. Entrez 0 pour une année couverte par un régime collectif (au travail, ou le régime d’un conjoint ou d’un parent), ou en cas d’exemption : moins de 18 ans, étudiant à temps plein de moins de 26 ans vivant chez ses parents, aide de dernier recours, 65 ans ou plus avec au moins 94 % du Supplément de revenu garanti maximal.
taxEstimate.noRrspLimit=Vide : aucun plafond n’est appliqué. Entrez le plafond de déduction REER de l’avis de cotisation pour que la déduction le respecte.
taxEstimate.noTransfer=Vide : rien n’est transféré, et ce que l’étudiant n’utilise pas est reporté.
taxEstimate.drugPlanAllYear=Vide : couvert toute l’année (12 mois), le cas habituel sans régime collectif.
taxEstimateHint.TUITION=Frais admissibles de l’année, d’après le T2202 de l’étudiant (et le relevé 8 au Québec). Les livres donnent les frais payés dans les catégories marquées frais de scolarité : vérifiez-les avec le feuillet. L’étudiant demande d’abord les frais pour ramener son propre impôt à zéro, en commençant par les montants reportés.
taxEstimateHint.TUITION_TO_TRANSFER=Pour l’étudiant : des frais de l’année dont il n’a pas besoin, jusqu’à 5 000 dollars moins ce qu’il en utilise (au Québec, à un parent ou grand-parent seulement, sans maximum en dollars). Entrez le montant transféré dans l’estimation de la personne qui le reçoit.
taxEstimateHint.TUITION_RECEIVED=Pour un conjoint, un parent ou un grand-parent : les frais de scolarité qu’un étudiant vous transfère, au plus 5 000 dollars (au Québec, les frais d’un enfant ou petit-enfant, dont le crédit est de 8 %).
taxEstimateHint.DONATIONS_CARRIED=Avec les dons de l’année, ils sont demandés jusqu’à 75 % du revenu net; l’excédent est reporté.
taxEstimateHint.CAPITAL_LOSSES_CARRIED=À leur montant imposable (la moitié des pertes), comme sur l’avis de cotisation. Elles réduisent seulement les gains en capital imposables de l’année.
