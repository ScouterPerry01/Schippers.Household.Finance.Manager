rateRule.threshold.unusualBill=Facture inhabituelle (pourcentage de la moyenne)
rateRule.threshold.unusualBill.hint=Une facture au-dessus de ce pourcentage de la moyenne de ses factures précédentes (au moins trois) est signalée comme inhabituelle : 125 veut dire un quart de plus.
rateRule.threshold.budgetAlert=Alerte de budget (pourcentage)
rateRule.threshold.budgetAlert.hint=Un budget est signalé dès que les dépenses dépassent ce pourcentage : 100 ne signale que les dépassements, 90 signale dès 90 %.
rateRule.threshold.t5Interest=Feuillet T5 pour les intérêts (dollars)
rateRule.threshold.t5Interest.hint=Les intérêts d’un même payeur dans l’année, à partir de ce montant, sont attendus sur un feuillet T5 dans la liste de l’année d’imposition. L’ARC n’exige pas de T5 pour moins de 50 $.
rateRule.threshold.statementFx=Tolérance des relevés en devise étrangère
rateRule.threshold.statementFx.hint=De combien une ligne de relevé peut différer d’un achat inscrit en devise étrangère et être quand même proposée comme correspondance : 0,035 est 3,5 %.
rateRule.threshold.receiptTaxAmount=Tolérance des taxes d’un reçu (dollars)
rateRule.threshold.receiptTaxAmount.hint=De combien la taxe imprimée sur un reçu peut différer de ce que donneraient ses lignes marquées, en dollars, pour qu’on se fie aux codes de taxe lorsque le reçu est réparti par article. La plus grande de cette tolérance et du taux s’applique.
rateRule.threshold.receiptTaxRate=Tolérance des taxes d’un reçu (taux)
rateRule.threshold.receiptTaxRate.hint=La même tolérance, en proportion de la taxe imprimée : 0,03 est 3 %.
rateRule.threshold.depreciationYears=Années d’amortissement
rateRule.threshold.depreciationYears.hint=Les années sur lesquelles un bien sans durée propre perd sa valeur, en ligne droite.
rateRule.threshold.depreciationResidual=Valeur résiduelle
rateRule.threshold.depreciationResidual.hint=La part de son prix qu’un bien sans valeur résiduelle propre garde à la fin : 0 ne laisse rien, 0,1 est 10 %.
rateRule.threshold.backupEvery=Sauvegardes automatiques (tous les combien de jours)
rateRule.threshold.backupEvery.hint=La fréquence des sauvegardes automatiques tant qu’un administrateur n’a pas choisi à l’écran Sauvegardes : 1 chaque jour, 7 chaque semaine, 0 aucune.
rateRule.threshold.backupKeep=Sauvegardes à conserver
