rateRule.vehicle.winterTiresOn.hint=Quand la tâche de pose des pneus d’hiver arrive à échéance, en mois-jour. Le Québec exige les pneus d’hiver à partir du 1er décembre (15 décembre avant 2019); ailleurs, c’est une suggestion.
