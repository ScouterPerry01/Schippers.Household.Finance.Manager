security.passwordRules=Règles des mots de passe
security.passwordRules.explain=Les règles que tout mot de passe du ménage doit suivre : nouveaux utilisateurs, mots de passe changés et réinitialisations avec la clé de récupération. Les mots de passe déjà choisis continuent de fonctionner. Seul un administrateur peut les changer; chaque changement prend effet aujourd’hui et est conservé dans Taux et règles avec sa date.
security.passwordRules.readOnly=Seul un administrateur peut changer ces règles.
security.passwordRules.minLength=Mot de passe le plus court, en caractères ({0} à {1})
security.passwordRules.capitals=Doit avoir une majuscule
security.passwordRules.smallLetters=Doit avoir une minuscule
security.passwordRules.digits=Doit avoir un chiffre
security.passwordRules.symbols=Doit avoir un symbole (autre chose qu’une lettre, un chiffre ou une espace)
security.passwordRules.notLoginName=Ne peut pas contenir le nom d’utilisateur
security.passwordRules.save=Enregistrer les règles des mots de passe
security.passwordRules.saved=Règles des mots de passe enregistrées. Elles s’appliquent dès aujourd’hui à tout mot de passe choisi à partir de maintenant.
security.passwordRules.summary.length=Au moins {0} caractères.
security.passwordRules.summary.needs=Il doit avoir {0}.
security.passwordRules.need.capitals=une majuscule
security.passwordRules.need.smallLetters=une minuscule
security.passwordRules.need.digits=un chiffre
security.passwordRules.need.symbols=un symbole
security.passwordRules.summary.notLoginName=Il ne peut pas contenir le nom d’utilisateur.
security.passwordRules.passphrase=Une phrase de quelques mots est facile à retenir et difficile à deviner.
security.passwordRules.cost=Les nouveaux mots de passe sont protégés par Argon2id avec {0} Mio de mémoire et {1} passes (Taux et règles). Chaque mot de passe garde le coût avec lequel il a été choisi, donc un changement ne bloque jamais personne; moins de 19 Mio ou 2 passes est refusé.
rateRule.security.password.minLength=Mot de passe le plus court
rateRule.security.password.minLength.hint=Le nombre minimum de caractères d’un mot de passe, de 8 à 64. Sert à la création du ménage, à l’ajout d’un utilisateur et au changement ou à la réinitialisation d’un mot de passe. Réglé par un administrateur à l’écran Sécurité.
rateRule.security.password.capitals=Mot de passe avec majuscule
rateRule.security.password.capitals.hint=true lorsque tout nouveau mot de passe doit avoir au moins une majuscule. Sert partout où l’on choisit un mot de passe.
rateRule.security.password.smallLetters=Mot de passe avec minuscule
rateRule.security.password.smallLetters.hint=true lorsque tout nouveau mot de passe doit avoir au moins une minuscule. Sert partout où l’on choisit un mot de passe.
rateRule.security.password.digits=Mot de passe avec chiffre
rateRule.security.password.digits.hint=true lorsque tout nouveau mot de passe doit avoir au moins un chiffre. Sert partout où l’on choisit un mot de passe.
rateRule.security.password.symbols=Mot de passe avec symbole
rateRule.security.password.symbols.hint=true lorsque tout nouveau mot de passe doit avoir un symbole : autre chose qu’une lettre, un chiffre ou une espace. Sert partout où l’on choisit un mot de passe.
rateRule.security.password.notLoginName=Mot de passe sans le nom d’utilisateur
rateRule.security.password.notLoginName.hint=true lorsqu’un mot de passe ne peut pas contenir le nom d’utilisateur (noms de trois caractères ou plus). Sert partout où l’on choisit un mot de passe.
rateRule.security.argon2.memory=Mémoire de protection des mots de passe (Mio)
rateRule.security.argon2.memory.hint=La mémoire qu’Argon2id utilise pour protéger un mot de passe choisi à partir de cette date, en Mio; au moins 19. Chaque mot de passe garde le coût avec lequel il a été choisi, donc les mots de passe existants continuent de fonctionner.
rateRule.security.argon2.iterations=Passes de protection des mots de passe
rateRule.security.argon2.iterations.hint=Le nombre de passes d’Argon2id pour protéger un mot de passe choisi à partir de cette date; au moins 2. Plus il y en a, plus le déverrouillage est lent et plus le mot de passe est difficile à deviner. Les mots de passe existants gardent leur propre coût.
rateRule.holiday.familyDay=Congé de février (fête de la Famille)
rateRule.holiday.familyDay.hint=true là où les banques ferment un lundi de février (le troisième, ou celui de la semaine du congé de février) : fête de la Famille, journée Louis Riel (MB), fête des Insulaires (PE), jour du Patrimoine (NS). Sert aux jours ouvrables : factures au dernier jour ouvrable et date de sortie des paiements.
rateRule.holiday.familyDay.week=Semaine du congé de février
rateRule.holiday.familyDay.week.hint=Le lundi de février où tombe le congé de février : 3 (le troisième) presque partout; la C.-B. a pris le deuxième de 2013 à 2018, et l’Î.-P.-É. en 2009. Sert aux jours ouvrables.
rateRule.holiday.civicHoliday=Congé d’août (congé civique)
rateRule.holiday.civicHoliday.hint=true là où les banques ferment le premier lundi d’août : congé civique, jour de la Colombie-Britannique, fête du Patrimoine (AB), fête du Nouveau-Brunswick, Natal Day (NS), fête de la Saskatchewan. Sert aux jours ouvrables.
rateRule.holiday.fetNationale=Fête nationale (24 juin)
rateRule.holiday.fetNationale.hint=true là où les banques ferment le 24 juin (Québec). Sert aux jours ouvrables.
rateRule.holiday.indigenousPeoplesDay=Journée nationale des peuples autochtones (21 juin)
rateRule.holiday.indigenousPeoplesDay.hint=true là où les banques ferment le 21 juin (Territoires du Nord-Ouest depuis 2001, Yukon depuis 2017). Sert aux jours ouvrables.
rateRule.holiday.nunavutDay=Jour du Nunavut (9 juillet)
rateRule.holiday.nunavutDay.hint=true là où les banques ferment le 9 juillet (Nunavut). Sert aux jours ouvrables.
rateRule.holiday.discoveryDay=Jour de la Découverte
rateRule.holiday.discoveryDay.hint=true là où les banques ferment le troisième lundi d’août (Yukon). Sert aux jours ouvrables.
rateRule.holiday.truthReconciliation=Journée de la vérité et de la réconciliation (30 septembre)
rateRule.holiday.truthReconciliation.hint=true là où les banques ferment le 30 septembre, congé fédéral depuis 2021. Sert aux jours ouvrables.

