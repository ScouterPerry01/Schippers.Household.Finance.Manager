about.link=À propos et confidentialité
about.privacy.title=Confidentialité
about.privacy.body=Vos renseignements financiers restent sur votre ordinateur et votre téléphone, chiffrés. RANN ne les reçoit pas et ne les recueille pas : il n’y a ni compte RANN, ni publicité, ni outil d’analyse. L’application ne va sur Internet que pour les taux de change de la Banque du Canada quand votre ménage utilise une autre monnaie, les téléchargements de cours que vous activez, les mises à jour de portefeuilles en lecture seule que vous demandez, les documents que vous choisissez de faire lire par l’IA (envoyés à Anthropic avec votre propre clé) et, sous Linux, la vérification des mises à jour si vous l’avez acceptée. La politique de confidentialité indique ce que chaque service apprend.
about.privacy.link=Lire la politique de confidentialité
about.notice.title=À noter
about.notice.tax=Les chiffres fiscaux (feuillets, gains en capital, droits de cotisation, frais médicaux, etc.) sont une aide à l’organisation et non des conseils fiscaux. Vérifiez-les avec vos feuillets et relevés, et consultez un fiscaliste en cas de doute.
about.notice.health=Les dossiers de santé sont une aide à l’organisation et non des conseils médicaux.
about.licence.title=Licence et code source
about.licence.body=RANN''s Roost est un logiciel libre distribué sous la licence publique générale GNU, version 3 ou ultérieure, sans aucune garantie. Son code source est sur GitHub. Les noms RANN, RANN''s Roost et RANN''s Roost Mobile ainsi que le logo sont © Perry Schippers, faisant affaire sous le nom de RANN, et ne sont pas visés par la licence.
about.source.link=Code source sur GitHub
about.support.title=Soutien
about.support.body=Questions et problèmes : info-rann-apps@NorthMail.ca, ou un billet sur GitHub. N’envoyez jamais de mots de passe, de clés de récupération, de sauvegardes ni de détails financiers.
