taxEstimate.leftOut=Non compris : montants transférés d’un conjoint autres que les frais de scolarité, montant pour personnes handicapées transféré d’une personne à charge ou pour une personne de moins de 18 ans, pertes autres qu’en capital, réductions d’impôt pour faible revenu, autres crédits et prestations remboursables (crédit d’impôt pour solidarité du Québec, prestations provinciales), contributions politiques, crédits pour impôt étranger et montant pour personne vivant seule au Québec.
taxEstimate.rates=Chaque taux, montant et seuil vient de Taux et règles (Impôt sur le revenu), où un administrateur peut ajouter une valeur pour une année ou une province.
taxEstimateInput.DONATED_SECURITIES_GAINS=Gains en capital sur des titres cotés donnés
taxEstimateInput.FSS_EXEMPT_INCOME=Du revenu, montants non assujettis au Fonds des services de santé (Québec)
taxEstimateInput.SECURITY_OPTIONS_DEDUCTION=Déductions pour options d’achat de titres
taxEstimateInput.SECURITY_OPTIONS_GIFTS=Dont, pour des titres d’options donnés à un organisme de bienfaisance
taxEstimateInput.SECURITY_OPTIONS_DEDUCTION_QC=Déduction pour option d’achat de titres dans la déclaration du Québec
taxEstimateInput.CAPITAL_GAINS_DEDUCTION=Déduction pour gains en capital (exonération cumulative)
taxEstimateInput.FSS_DEDUCTIONS=Des déductions, celles qui réduisent le revenu du Fonds des services de santé (Québec)
taxEstimateInput.DISABILITY=Admissible au crédit d’impôt pour personnes handicapées (formulaire T2201 approuvé)
taxEstimateInput.SPOUSE_DISABILITY=Époux ou conjoint aussi admissible au crédit d’impôt pour personnes handicapées
taxEstimateInput.AMT_CARRIED_QC=Impôt minimum reporté (Québec)
taxEstimateHint.DISABILITY=Cochez-la quand l’ARC a approuvé le formulaire T2201 pour cette personne (au Québec, Revenu Québec doit aussi avoir accepté l’attestation de déficience). Elle donne le montant pour personnes handicapées (fédéral, provincial ou territorial, et du Québec) et, avec un revenu de travail, le supplément pour personnes handicapées de l’Allocation canadienne pour les travailleurs. Le montant pour une personne de moins de 18 ans et son supplément ne sont pas comptés.
taxEstimateHint.SPOUSE_DISABILITY=Quand les deux conjoints sont admissibles, chacun demande son propre supplément pour personnes handicapées, réduit à la moitié du taux sur le revenu familial.
taxEstimateHint.DONATED_SECURITIES_GAINS=Gains sur des actions, obligations ou parts de fonds cotées en bourse et données à un organisme de bienfaisance (formulaire T1170). Ils ne sont pas imposés et ne font pas partie des gains en capital imposables ci-dessus, mais 30 % comptent pour l’impôt minimum.
taxEstimateHint.FSS_EXEMPT_INCOME=Montants du revenu ci-dessus que l’annexe F exclut en plus de la paie, de la pension de la Sécurité de la vieillesse et de la majoration des dividendes (lignes 20 à 33) : pension alimentaire reçue, aide sociale, indemnités de remplacement du revenu (CNESST, SAAQ) et suppléments fédéraux nets, bourses d’études, sommes attribuées par un régime de participation aux bénéfices, récupération d’un REER au profit du conjoint.
taxEstimateHint.SECURITY_OPTIONS_DEDUCTION=Des cases 39, 41, 91 et 92 des feuillets T4 (ligne 24900), avec la déduction pour des titres d’options donnés à un organisme de bienfaisance. Elle réduit le revenu imposable; l’impôt minimum la rajoute, sauf 70 % de la partie pour les titres donnés.
taxEstimateHint.SECURITY_OPTIONS_GIFTS=La déduction supplémentaire quand des titres acquis par une option ont été donnés à un organisme de bienfaisance (alinéa 110(1)d.01)), comprise dans le montant ci-dessus.
taxEstimateHint.SECURITY_OPTIONS_DEDUCTION_QC=La déduction du Québec (ligne 297, point 02, selon le relevé 1) peut différer de la déduction fédérale. Inscrivez-la dans ce cas.
taxEstimateHint.CAPITAL_GAINS_DEDUCTION=La partie de l’exonération cumulative des gains en capital demandée cette année (ligne 25400, ligne 292 au Québec), à son montant imposable : au plus les gains en capital imposables ci-dessus. 30 % des gains exonérés comptent pour l’impôt minimum.
taxEstimateHint.FSS_DEDUCTIONS=Des déductions inscrites ci-dessus, celles que l’annexe F soustrait (lignes 41 à 62) : pension alimentaire payée, frais financiers et frais d’intérêts, perte au titre d’un placement d’entreprise, revenu de retraite transféré au conjoint, remboursements de sommes reçues.
taxEstimateHint.AMT_CARRIED_QC=Impôt supplémentaire du Québec payé pour l’impôt minimum dans les sept années précédentes et pas encore récupéré (ligne 63 du formulaire TP-776.42 de l’an dernier). Il ramène l’impôt du Québec jusqu’à l’impôt minimum du Québec.
taxEstimate.sameAsFederal=Vide : la déduction fédérale s’applique.
taxEstimateCarry.MINIMUM_TAX_QC=Impôt minimum, Québec
taxEstimateLine.SECURITY_OPTIONS=Déductions pour options d’achat de titres
taxEstimateLine.CAPITAL_GAINS_DEDUCTION=Déduction pour gains en capital
taxEstimateLine.DISABILITY=Montant pour personnes handicapées
taxEstimateLine.CWB_DISABILITY=Supplément pour personnes handicapées de l’Allocation canadienne pour les travailleurs
rateRule.tax.fed.brackets=Tranches d’imposition fédérales
rateRule.tax.fed.brackets.hint=Le taux fédéral sur le revenu imposable au-delà de chaque seuil. Sert à l’estimation de l’impôt sur le revenu de l’écran Impôts.
rateRule.tax.fed.creditRate=Taux fédéral des crédits non remboursables
rateRule.tax.fed.creditRate.hint=Le taux appliqué au total des montants fédéraux (personnel de base, âge, RPC, AE et autres), normalement le taux d’imposition le plus bas. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.bpa=Montant personnel de base fédéral
rateRule.tax.fed.bpa.hint=Maximum; minimum; revenu net où il commence à diminuer; revenu net où il atteint le minimum. C’est aussi la base du montant pour époux. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.employmentAmount=Montant canadien pour emploi
rateRule.tax.fed.employmentAmount.hint=Le montant maximal pour les revenus d’emploi (le moindre de ce montant et des revenus d’emploi). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.age=Montant fédéral en raison de l’âge
rateRule.tax.fed.age.hint=Maximum; revenu net au-delà duquel il est réduit; taux de réduction. Pour les personnes de 65 ans ou plus au 31 décembre. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.pension=Montant fédéral pour revenu de pension
rateRule.tax.fed.pension.hint=Le montant maximal sur les revenus de pension admissibles. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.donation=Taux fédéraux du crédit pour dons
rateRule.tax.fed.donation.hint=Première tranche (200 dollars); son taux; le taux au-delà; le taux plus élevé sur les dons correspondant au revenu de la tranche supérieure. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.topUpCredit=Crédit d’impôt complémentaire fédéral
rateRule.tax.fed.topUpCredit.hint=Montants des crédits au-delà de ce seuil; le taux supplémentaire sur ceux-ci, qui maintient 15 % sur les crédits au-delà de la première tranche depuis la baisse du taux le plus bas. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.quebecAbatement=Abattement du Québec
rateRule.tax.fed.quebecAbatement.hint=La part de l’impôt fédéral de base remboursée aux résidents du Québec. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cpp=Cotisations au RPC : partie de base
rateRule.tax.cpp.hint=Cotisation maximale de l’employé (premier palier); taux de base; taux de l’employé. La partie de base des cotisations payées donne un crédit, le reste une déduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qpp=Cotisations au RRQ : partie de base
rateRule.tax.qpp.hint=Cotisation maximale de l’employé (premier palier); taux de base; taux de l’employé. La partie de base des cotisations payées donne un crédit, le reste une déduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.brackets=Tranches d’imposition provinciales ou territoriales
rateRule.tax.prov.brackets.hint=Le taux de la province ou du territoire sur le revenu imposable au-delà de chaque seuil. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.creditRate=Taux provincial des crédits non remboursables
rateRule.tax.prov.creditRate.hint=Le taux appliqué au total des montants provinciaux ou territoriaux. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.bpa=Montant personnel de base provincial
rateRule.tax.prov.bpa.hint=Le montant; ou maximum; minimum; revenu net où il commence à diminuer; revenu net où il atteint le minimum. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.spouse=Montant provincial pour époux
rateRule.tax.prov.spouse.hint=Maximum; revenu net de l’époux au-delà duquel il est réduit dollar pour dollar. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.age=Montant provincial en raison de l’âge
rateRule.tax.prov.age.hint=Maximum; revenu net au-delà duquel il est réduit; taux de réduction. Au Québec, la réduction porte sur le revenu familial et vise aussi le montant pour revenus de retraite. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.seniorSupplement=Montant supplémentaire pour aînés
rateRule.tax.prov.seniorSupplement.hint=Un montant de plus pour les personnes de 65 ans ou plus, sans critère de revenu (Saskatchewan). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.employmentAmount=Montant canadien pour emploi territorial
rateRule.tax.prov.employmentAmount.hint=Le montant maximal pour les revenus d’emploi dans la déclaration territoriale (Yukon). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.pension=Montant provincial pour revenu de pension
rateRule.tax.prov.pension.hint=Le montant maximal sur les revenus de pension admissibles. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.medical=Seuil provincial des frais médicaux
rateRule.tax.prov.medical.hint=Taux du revenu net; montant fixe. Les frais médicaux comptent au-delà du moindre des deux. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.donation=Taux provinciaux du crédit pour dons
rateRule.tax.prov.donation.hint=Première tranche (200 dollars); son taux; le taux au-delà; et, s’il y en a un, le taux plus élevé sur les dons correspondant au revenu de la tranche supérieure. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.dividends=Crédit d’impôt provincial pour dividendes
rateRule.tax.prov.dividends.hint=Taux du crédit sur le montant imposable des dividendes déterminés, puis des autres dividendes. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.supplementalCredit=Crédit d’impôt supplémentaire
rateRule.tax.prov.supplementalCredit.hint=Montants des crédits au-delà de ce seuil; le taux supplémentaire sur ceux-ci (Alberta, depuis sa tranche à 8 %). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.surtax=Surtaxe provinciale
rateRule.tax.prov.surtax.hint=Seuil; taux; seuil; taux. Chaque taux s’applique à l’impôt provincial après les crédits au-delà de son seuil (Ontario). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.taxReduction=Réduction d’impôt provinciale
rateRule.tax.prov.taxReduction.hint=La réduction de base : l’impôt est réduit du double de ce montant moins l’impôt, s’il est positif (Ontario). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.lowIncomeReduction=Réduction d’impôt pour faible revenu
rateRule.tax.prov.lowIncomeReduction.hint=Maximum; revenu net au-delà duquel elle est réduite; taux de réduction (Colombie-Britannique). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.healthPremium=Contribution-santé
rateRule.tax.prov.healthPremium.hint=Pour chaque palier : revenu imposable à partir duquel; taux sur le revenu au-delà; plafond de la contribution (contribution-santé de l’Ontario). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.workerDeduction=Déduction pour travailleur (Québec)
rateRule.tax.qc.workerDeduction.hint=Taux des revenus d’emploi; maximum. Déduite du revenu dans la déclaration du Québec. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.retirement=Montant pour revenus de retraite (Québec)
rateRule.tax.qc.retirement.hint=Maximum; facteur appliqué aux revenus de pension admissibles. Réduit avec le montant en raison de l’âge selon le revenu familial. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.medical=Crédit pour frais médicaux (Québec)
rateRule.tax.qc.medical.hint=Taux du revenu familial au-delà duquel les frais comptent; taux du crédit. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.donationLimit=Plafond des dons
rateRule.tax.donationLimit.hint=La part du revenu net jusqu’à laquelle les dons, ceux de l’année et ceux reportés, peuvent être demandés dans une année; le reste est reporté. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.tuitionTransfer=Transfert maximal des frais de scolarité (fédéral)
rateRule.tax.fed.tuitionTransfer.hint=Le maximum du montant de l’année pour frais de scolarité qu’un étudiant peut transférer à un conjoint, un parent ou un grand-parent, moins ce qu’il utilise lui-même. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.tuition=Crédit provincial pour frais de scolarité
rateRule.tax.prov.tuition.hint=Si les frais de scolarité de l’année donnent le crédit provincial ou territorial (l’Ontario, la Saskatchewan et l’Alberta l’ont aboli). Les montants inutilisés reportés comptent dans tous les cas. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.tuitionTransfer=Transfert maximal des frais de scolarité (provincial)
rateRule.tax.prov.tuitionTransfer.hint=Le maximum du montant provincial ou territorial de l’année pour frais de scolarité qu’un étudiant peut transférer à un conjoint, un parent ou un grand-parent. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.tuition=Crédit pour frais de scolarité (Québec)
rateRule.tax.qc.tuition.hint=Le taux du crédit du Québec sur les frais de scolarité. Les frais inutilisés sont reportés ou transférés à un parent ou grand-parent. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.single=Allocation canadienne pour les travailleurs, personne seule
rateRule.tax.cwb.single.hint=Seuil de revenu de travail; taux d’accumulation; maximum; revenu net familial rajusté où commence la réduction; taux de réduction. Le Québec, l’Alberta et le Nunavut ont leurs propres valeurs. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.couple=Allocation canadienne pour les travailleurs, couple
rateRule.tax.cwb.couple.hint=Pour une personne qui a un époux ou un conjoint de fait et pas d’enfant : seuil de revenu de travail; taux d’accumulation; maximum; revenu net familial où commence la réduction; taux de réduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.singleParent=Allocation canadienne pour les travailleurs, parent seul
rateRule.tax.cwb.singleParent.hint=Pour une personne qui a une personne à charge admissible et pas de conjoint : seuil de revenu de travail; taux d’accumulation; maximum; revenu net familial où commence la réduction; taux de réduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.coupleChildren=Allocation canadienne pour les travailleurs, couple avec enfants
rateRule.tax.cwb.coupleChildren.hint=Pour un couple qui a une personne à charge admissible : seuil de revenu de travail; taux d’accumulation; maximum; revenu net familial où commence la réduction; taux de réduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.secondaryEarner=Exemption du deuxième soutien (allocation pour les travailleurs)
rateRule.tax.cwb.secondaryEarner.hint=Le maximum du revenu de travail du conjoint au revenu le plus bas exclu du revenu net familial d’un couple pour l’Allocation canadienne pour les travailleurs. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.medicalSupplement=Supplément remboursable pour frais médicaux
rateRule.tax.fed.medicalSupplement.hint=Maximum; revenu gagné minimal; revenu net familial où il commence à diminuer; taux des frais médicaux demandés; taux de réduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.workPremium=Prime au travail du Québec
rateRule.tax.qc.workPremium.hint=Revenu de travail exclu pour une personne seule; pour un couple; plafond pour une personne seule; pour un couple (aussi le début de la réduction); taux sans enfants; pour un parent seul; pour un couple avec enfants; taux de réduction sur le revenu familial. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.medicalRefund=Crédit remboursable pour frais médicaux du Québec
rateRule.tax.qc.medicalRefund.hint=Maximum; revenu de travail minimal; revenu familial où il commence à diminuer; taux des frais médicaux; taux de réduction. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.gstCredit=Crédit pour la TPS/TVH
rateRule.tax.gstCredit.hint=Par année de base (versé à partir du juillet suivant) : montant par adulte; par enfant; supplément pour personne seule; revenu net où le supplément commence; son taux; seuil de revenu net familial; taux de réduction. Depuis juillet 2026, l’Allocation canadienne pour l’épicerie et les besoins essentiels. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.ccb=Allocation canadienne pour enfants
rateRule.tax.ccb.hint=Par année de base (versée à partir du juillet suivant) : par enfant de moins de 6 ans; par enfant de 6 à 17 ans; premier et deuxième seuils de revenu net familial; taux de réduction entre eux pour 1, 2, 3, 4 enfants ou plus; puis les taux au-delà du deuxième seuil. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.oasRecovery=Impôt de récupération de la SV
rateRule.tax.oasRecovery.hint=Seuil de revenu net; taux. La pension de la Sécurité de la vieillesse est remboursée à ce taux du revenu net au-delà du seuil, jusqu’à concurrence de la pension reçue. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.amt=Impôt minimum de remplacement fédéral
rateRule.tax.amt.hint=Taux; exemption de base; part des crédits non remboursables admise (autres que les dons); part du crédit pour dons; part rajoutée des déductions admises en partie seulement; la part de la majoration retirée des dividendes déterminés et des autres dividendes imposables. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.amt=Impôt minimum provincial
rateRule.tax.prov.amt.hint=L’impôt supplémentaire provincial ou territorial, en taux de l’impôt supplémentaire fédéral; le taux du report de l’impôt minimum fédéral récupéré dans la déclaration provinciale ou territoriale. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.amt=Impôt minimum de remplacement du Québec
rateRule.tax.qc.amt.hint=Taux; exemption de base; part des crédits admise (autres que les dons); part du crédit pour dons; part rajoutée des déductions admises en partie seulement, dont la déduction pour travailleur. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.fed.disability=Montant fédéral pour personnes handicapées
rateRule.tax.fed.disability.hint=Le montant demandé par une personne de 18 ans ou plus admissible au crédit d’impôt pour personnes handicapées (formulaire T2201 approuvé), ligne 31600. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.prov.disability=Montant provincial ou territorial pour personnes handicapées
rateRule.tax.prov.disability.hint=Le montant pour personnes handicapées de la déclaration provinciale ou territoriale (ligne 58440); au Québec, le montant pour déficience grave et prolongée des fonctions mentales ou physiques (ligne 376). Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.cwb.disability=Supplément pour personnes handicapées de l’Allocation canadienne pour les travailleurs
rateRule.tax.cwb.disability.hint=Revenu de travail de la personne au-delà duquel il s’accumule; taux d’accumulation sans époux ou conjoint admissible; avec un; maximum; revenu net familial rajusté où commence la réduction pour une personne seule; avec un conjoint; avec une personne à charge admissible et sans conjoint; avec les deux; taux de réduction; taux de réduction quand les deux conjoints sont admissibles au crédit d’impôt pour personnes handicapées. Le Québec, l’Alberta et le Nunavut ont leurs propres valeurs. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.amt.gains=Impôt minimum fédéral sur les titres donnés et les gains exonérés
rateRule.tax.amt.gains.hint=Part des gains en capital sur des dons de titres cotés en bourse ajoutée au revenu imposable rajusté; part de la déduction pour gains en capital et de la déduction pour options d’achat de titres donnés qui en est soustraite. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.amtGains=Impôt minimum du Québec sur les titres donnés et les gains exonérés
rateRule.tax.qc.amtGains.hint=Pour l’impôt minimum de remplacement du Québec : part des gains en capital sur des dons de titres cotés en bourse ajoutée; part de la déduction pour gains en capital et de la déduction pour option d’achat de titres donnés qui est soustraite. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.fss=Cotisation au Fonds des services de santé (Québec)
rateRule.tax.qc.fss.hint=Seuil d’exclusion; deuxième seuil; taux; le maximum sous le deuxième seuil; maximum. Sur les revenus autres que d’emploi, la SV et la majoration des dividendes. Sert à l’estimation de l’impôt sur le revenu.
rateRule.tax.qc.drugPremium=Prime d’assurance médicaments du Québec
rateRule.tax.qc.drugPremium.hint=La prime maximale de l’année; revenu familial exempté pour une personne seule, un parent seul avec un enfant ou plus, un couple, un couple avec un enfant ou plus; revenu au-delà de l’exemption où commence le taux plus élevé; les deux taux pour une personne seule, puis pour un couple. Sert à l’estimation de l’impôt sur le revenu.

